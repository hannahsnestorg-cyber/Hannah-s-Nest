[build]
  publish = "."

[[redirects]]
  from = "/waitlist"
  to = "/#join"
  status = 302

[[redirects]]
  from = "/terms"
  to = "/membership-terms"
  status = 301

[[headers]]
  for = "/*"
  [headers.values]
    Content-Security-Policy = "default-src 'self'; script-src 'self' 'unsafe-inline' 'unsafe-eval' https://cdn.jsdelivr.net; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; font-src 'self' data: https://fonts.gstatic.com; img-src 'self' data: blob: https:; media-src 'self' data: blob:; connect-src 'self' https://yqyrgfeqrjsnqiiaiund.supabase.co wss://yqyrgfeqrjsnqiiaiund.supabase.co https://feeds.behold.so https://fonts.googleapis.com https://fonts.gstatic.com; frame-src 'self' https://tally.so; form-action 'self' https://tally.so; base-uri 'self'; object-src 'none'; frame-ancestors 'none'; upgrade-insecure-requests"
    X-Content-Type-Options = "nosniff"
    X-Frame-Options = "DENY"
    Referrer-Policy = "strict-origin-when-cross-origin"
    Permissions-Policy = "camera=(), microphone=(), geolocation=(), payment=(), interest-cohort=()"
